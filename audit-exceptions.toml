entry = "t3code/main/desktop-window-state"
missing_count = 2
missing_sha256 = "d0be1c84a334eb9ec16421d1eb1326a2e30a482a1102eedcdb849c83fb4b0a3e"
reason = "desktopWindowStatePath moved out of DesktopEnvironment into DesktopStatePaths' resolveDesktopClientPaths (desktop-client-location, then #4437, both stacked on this pin), where it still joins desktop-window-state.json onto the client state dir. main.ts's `DesktopWindowState.layer.pipe(Layer.provideMerge(DesktopAppSettings.layer))` is combined with the client suite's DesktopRunningLocalServers pipe: DesktopWindowState.layer is provide-merged there ahead of DesktopAppSettings.layer, so the window state service is still exposed and still reads the settings fallback."

