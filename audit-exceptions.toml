entry = "t3code/main/server-location-overrides"
missing_count = 85
missing_sha256 = "be5612424776662f792275ffa58b3ba1f1b132c8136d2580223c7dabb8d13668"
reason = "server-config-file extends the location flag bundles with serverConfigFileFlags and T3CODE_SERVER_CONFIG_FILE. The split-storage and client-storage topics replace resolveBaseDir/fallbackBaseDir with layout selection, then apply the same per-category overrides through deriveServerStoragePaths; legacy stateDir remains dataDir, while split state/runtime roots own the database, IDs, secrets, logs and runtime record. Desktop override expansion uses expandT3HomePath and backendCwd. The Windows filter now has Set<string> and matches upper-cased names from T3_STORAGE_ENVIRONMENT_NAMES and T3_SERVER_LOCATION_ENVIRONMENT_NAMES. Service layer parameters gain storage roots; triage/uninstall/pair discovery use the selected roots, trace summary also reads server.json, and AgentSessionScanner's exclusion test expands to all five roots. Boot-service, SSH and dev-runner lists use the shared override-name constant, still clearing every original override. SSH fixtures retain launch/diagnostic assertions while accepting login-shell options and collecting stdout; the renamed pinning test covers every server override."

