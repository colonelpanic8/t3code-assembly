missing_sha256 = "bfb19e3a6ee795228d25e57637128980042d167d05db580d7165370ecfa5e51f"
reason = "#4437's storage roots replace the suite's baseDir/variant runtime-state paths. Storage path lines are removed by the patches/t3code-client-suite-storage-roots.patch fixup: deriveServerRuntimeStatePath is deleted, and DesktopRunningLocalServers reads server-runtime.json from the runtime dir and environment-id from the state dir (the server data dir override or the layout's roots; userdata in the legacy layout, so that path is unchanged), passing `--base-dir` to `t3 pair` in the legacy layout and `--storage-layout xdg` in the split layout, with tests updated for both. pair.ts's per-base statePath line is resolved to #4437's candidate discovery (legacy and split candidates through deriveServerStoragePaths), while `--json`, asJsonCommand and the shared reader are carried. The discovery fixture expands its origin object across lines. Window bounds belong to DesktopWindowState rather than DesktopAppSettings; the combined fixture supplies both services and retains the bounds assertions."

