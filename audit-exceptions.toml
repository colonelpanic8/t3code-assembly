reason = "Client path lines are rewritten by #4437, which is stacked on a merge containing this pin and lacks them in its own tree: resolveDesktopClientPaths now takes the storage layout's configDir/stateDir and a Pick<StoragePathOperations> instead of t3Home/isDevelopment/joinPath/resolvePath, and expands `~` through the shared resolveT3ConfiguredPath instead of the local normalizeConfiguredDir/expandHomeDir; DesktopEnvironment and DesktopEarlyElectronStartup feed it the selected storage roots. --client-dir and T3CODE_CLIENT_DIR precedence and every client file name are unchanged. The last is desktop-window-state's main.ts DesktopWindowState layer line, inherited and combined into the client suite's DesktopRunningLocalServers pipe. Client-directory and inherited window-state test fixtures retain the same values in expanded formatting."

