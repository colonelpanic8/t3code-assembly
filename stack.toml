# Ordered integration manifest for the personal T3 Code stack.
#
# This file is INTENT: which upstream PRs and fork branches are carried, and in
# what order they are merged onto live upstream main. `scripts/rebuild-t3code-stack.sh`
# consumes it and produces `t3code-stack.lock.json` plus a force-pushed
# integration branch on the fork.
#
# The integration branch is a BUILD ARTIFACT. Never commit to it, never base
# work on it, never merge it back. It is regenerated from scratch every refresh.
#
# Order matters: later entries may build on earlier UI work, and adjacency keeps
# conflict resolution local. Entries whose `kind` is "external" belong to other
# authors and cannot be rebased -- they merge from the PR head as-is.

upstream = "https://github.com/pingdotgg/t3code"
upstream_ref = "main"
fork = "https://github.com/colonelpanic8/t3code"
integration_branch = "t3code/stack"
tag_prefix = "t3code-stack"

