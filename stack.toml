to the exact optional-property shape used by the assembled project model.
"""

[[epilogue]]
patch = "patches/t3code-chat-composer-stash-merge.patch"
summary = "Restore prompt-stash dedupe and snapshot keys after composer merges"
note = """
#4271 and #4394 both reshape ChatComposer around the prompt-stash implementation.
Their assembled replay mangles the NUL-delimited template strings used for image
deduplication and in-flight snapshot identity. Neither topic is broken alone;
this patch restores those three stack-emergent expressions.
"""

[[epilogue]]
patch = "patches/t3code-dedupe-environment-icon.patch"
summary = "De-duplicate the EnvironmentIcon helper in BranchToolbarEnvironmentSelector"
note = """
t3code/client-suite and t3code/unify-environment-selection each add the same
EnvironmentIcon helper to BranchToolbarEnvironmentSelector.tsx; git merges
both additions without conflict and the web build fails on the duplicate
declaration. Cannot live on either topic; only the esbuild syntax gate
catches it (the content audit looks for missing lines, not duplicates).
"""
