# GROUP manifest: the command-palette / new-thread-picker cluster.
#
# Membership criterion: edits the CommandPalette.logic.ts / .tsx /
# .logic.test.ts trio. Merging members here, against upstream main, resolves
# their combination once against a stable base.
#
# The output branch is pinned as a single `kind = "fork"` entry in
# assembly.toml. Same tool, two levels; a subsystem tree, in linux-next
# terms.
#
# Deliberately NOT in this group:
#   #4271, #4277  share only keybindings.ts, where conflicts are additive
#                 one-line registry entries -- not worth coupling.
#   #4259         "new thread picker" by name, but touches none of these files.
#   #4401, #4474  touch CommandPalette.tsx incidentally (one file each).
#
# Rebuild:
#   bin/rebuild-t3code-assembly.py --manifest thread-picker.toml \
#       --mode reproduce --write-lock --push

upstream = "https://github.com/pingdotgg/t3code"
upstream_ref = "main"
fork = "https://github.com/colonelpanic8/t3code"
integration_branch = "t3code/group/thread-picker"
tag_prefix = "t3code-thread-picker"

[[entry]]
pr = 4263
kind = "fork"
branch = "t3code/replace-ctrl-n-thread-modal"
pin = "200eed637302"
summary = "Unify the new thread project picker"

[[entry]]
pr = 4257
kind = "fork"
branch = "t3code/directory-path-tab-completion"
pin = "5d01957d2a42"
summary = "Directory path tab completion"

[[entry]]
pr = 4258
kind = "fork"
branch = "t3code/add-project-shortcut"
pin = "7c2a7f96c227"
summary = "Add configurable add-project shortcut"

[[entry]]
pr = 4426
kind = "fork"
branch = "t3code/remote-environment-thread-creation"
pin = "a1a152038c67"
summary = "Add environment-aware new thread picker"

[[entry]]
pr = 4590
kind = "fork"
branch = "t3code/error-on-unreachable-environment-browse"
pin = "fc2294e7d4ca"
summary = "Error instead of silently failing when browsing an unreachable environment"
note = """
In this group because it edits the CommandPalette trio, in the browse/submit
region #4257 and #4426 also touch. Last, so its availability gating composes
on the combined browse flow.
"""

