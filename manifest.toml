provenance_file = "stack-build-info.json"

[remotes]
upstream = "https://github.com/pingdotgg/t3code"
fork = "https://github.com/colonelpanic8/t3code"

[base]
remote = "upstream"
ref = "main"
submodule = "t3code"

[publish]
remote = "fork"
branch = "t3code/assembled"
tag_prefix = "t3code-assembled"

