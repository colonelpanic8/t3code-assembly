[[entry]]
branch = "fork:t3code/main/favicon-refresh-on-click"
summary = "Refresh a project icon when it is clicked"
note = "Re-port of the closed #4337 onto main's rewritten ProjectFavicon; upstream declined it as undiscoverable, so it is carried without a PR."

# Codex image generations append their saved images to the turn's final reply,
# so generated images show in chat.
[[entry]]
pr = 19066
summary = "Codex generated images show in chat"
note = "External (shivamhwp)."

# Semver comparisons ignore build metadata. The Nix flake versions assembled
# builds as an upstream nightly plus "+<distance>.g<upstream>.assembly.<commit>",
# and the client's version-skew check would otherwise order hosts by commit hash.
# The desktop and web nightly detectors also accept that suffix, so the build
# carries upstream's Nightly name, sidebar sky, and update channel.
[[entry]]
branch = "fork:t3code/main/semver-build-metadata"
summary = "Ignore build metadata when comparing versions or detecting nightlies"

[[entry]]
branch = "fork:t3code/main/android-intents"
summary = "Open custom-scheme links, ask T3 Code about selected text, and opt in to sending link prompts"

[[entry]]
branch = "fork:t3code/main/eva-extension"
summary = "Let EVA read threads and start work through an Android extension"

# A hiddenPullRequestRepositories server setting leaves those repositories out
