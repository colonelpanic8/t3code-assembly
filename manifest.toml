[[entry]]
branch = "fork:t3code/main/pr-4420"
pr = 4420
summary = "Refuse startup when another server owns the state dir"
note = "Closed without comment. Re-ported; the PR's busy_timeout half already reached the base through upstream main and is not duplicated."

[[entry]]
branch = "fork:t3code/main/pr-4484"
pr = 4484
summary = "Recover draft thread IDs after failed bootstrap"
note = "Nothing upstream sets bootstrapThreadDisposition for v2 launches. Deletes the provisional thread on a failed owned launch and propagates the disposition."

[[entry]]
branch = "fork:t3code/main/pr-6507"
pr = 6507
summary = "Direct model and reasoning keybindings"
note = "Rebased port of the upstream PR onto main."

[[entry]]
branch = "fork:t3code/main/usage-host-resilience"
summary = "Keep usage available when hosts disconnect or reconnect"

[[entry]]
branch = "fork:t3code/main/typecheck-fixes"
summary = "Resolve transitive type declarations through workspace-local dependencies"

[[entry]]
branch = "fork:t3code/main/client-storage-separation"
summary = "Client storage separate from the server's T3 home, plus `t3 storage migrate`"
note = "Built on #4437's split layout and must stay after it. In the legacy layout everything stays in ~/.t3/userdata; in split layout the client uses t3code-client XDG roots."

[[entry]]
branch = "fork:t3code/main/declarative-settings"
summary = "Nix-managed read-only settings, keybindings, and client settings layers"
note = "T3CODE_MANAGED_{SETTINGS,KEYBINDINGS,CLIENT_SETTINGS}_FILE override user values, render as managed in the UI, and reject writes. The Home Manager options live in the pr-4699 entry."

[[entry]]
branch = "fork:t3code/main/mobile-tailscale-fleet"
summary = "Pair once, join the Nix-declared fleet over Tailscale"
note = "One commit on managed-fleet: T3CODE_FLEET_MANIFEST_FILE and server.issueFleetHandoff let a client paired with one member redeem single-use handoffs at the others; clients follow the manifest. The Home Manager fleetManifest option lives in the pr-4699 entry."

