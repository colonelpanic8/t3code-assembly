# filling the mobile Pull Requests tab.
[[entry]]
branch = "fork:t3code/main/pr-list-hidden-repositories"
pr = 21601
summary = "Hide chosen repositories from the pull request list"

# The phone tracks a settings feed: an https file, plain or age-encrypted to
# the fleet enrollment key, whose preferences override the phone's own and
# lock their rows. Dotfiles publishes settings.age next to fleet.age.
[[entry]]
branch = "fork:t3code/main/mobile-settings-feed"
summary = "Phone settings from an external settings feed"
note = "Stacked on mobile-tailscale-fleet (reuses its download and age identity)."

[[entry]]
branch = "fork:t3code/main/scoped-environment-keys-integration"
summary = "Preserve colon-containing environment IDs when loading chat images"
note = "Backport of 92be4fd1b309 from current upstream main onto the pinned base. Keeps desktop/web timeline asset requests addressed to fleet:<host> and aligns mobile scoped keys; existing composer drafts remain readable."

