[[entry]]
branch = "fork:t3code/orchestration-v2-main/client-environment-suite"
summary = "Client-only desktop, local server discovery and pairing, environment-scoped settings (#9376)"
note = "This branch IS the head of upstream PR #9376 (against #2829's branch t3code/codex-turn-mapping; #9361 was the same change before its head branch was renamed). It superseded #4444 and folded in #4496 and #4559 (and earlier #4474, #4486, #4548, #4567). Discovery reads server-runtime.json and pairs through the bundled `t3 pair --json`; a packaged desktop attaches to a running server instead of spawning a second backend. Per-environment accent colors and display names (#4505, #4538) were dropped from the suite on 2026-09-02 and live on fork:t3code/environment-accent-and-names, which is not carried. Split-layout (XDG) runtime state is not yet discovered: both the desktop and `t3 pair` derive legacy paths, which is fine for this install's legacy layout."
fixup = "patches/orchestration-v2-main-client-environment-suite.patch"

